    <script>
      setTimeout(function () {
        var root = document.getElementById("root");
        var fallback = document.getElementById("loading-fallback");
        if (root && fallback && root.contains(fallback)) {
          root.innerHTML = "<div style=\"text-align: center; max-width: 28rem; padding: 1rem;\"><p style=\"color: #94a3b8; margin-bottom: 0.75rem;\">O carregamento está demorando.</p><p style=\"font-size: 0.875rem; color: #64748b;\">Verifique: (1) Abra o Console do navegador (F12) para ver erros. (2) No Vercel, confira as variáveis <code style=\"background: #1e293b; padding: 0.125rem 0.25rem; border-radius: 0.25rem;\">VITE_SUPABASE_URL</code> e <code style=\"background: #1e293b; padding: 0.125rem 0.25rem; border-radius: 0.25rem;\">VITE_SUPABASE_PUBLISHABLE_KEY</code> e faça um novo deploy.</p></div>";
        }
      }, 8000);
    </script>
